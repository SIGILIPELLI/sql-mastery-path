site_name: SQL Mastery Path
site_description: A structured, module-wise SQL training program from entry level to master level.
site_url: https://sigilipelli.github.io/sql-mastery-path/
repo_url: https://github.com/SIGILIPELLI/sql-mastery-path
repo_name: sql-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & First Queries": level-1/01-setup-first-queries.md
      - "02 · SELECT Basics & Data Types": level-1/02-select-basics-data-types.md
      - "03 · Filtering with WHERE": level-1/03-filtering-where.md
      - "04 · Sorting & Limiting Results": level-1/04-sorting-limiting.md
      - "05 · Aggregate Functions & GROUP BY": level-1/05-aggregates-group-by.md
      - "06 · Joins Basics": level-1/06-joins-basics.md
      - "07 · Working with NULL": level-1/07-working-with-null.md
      - "08 · Creating Tables": level-1/08-creating-tables.md
      - "09 · Inserting, Updating, Deleting Data": level-1/09-insert-update-delete.md
      - "10 · Project — Library/Bookstore Database": level-1/10-project-library-database.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
